[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantalpha"
version = "0.1.0"
description = "WorldQuant BRAIN AI-assisted alpha research loop"
requires-python = ">=3.10"
# 唯一运行时依赖：HTTP 客户端（模拟/轮询/状态拉取；候选生成由对话层 agent 完成，零 LLM 依赖）
dependencies = ["requests>=2.31"]

# CLI 入口：安装后提供 `qa` 命令（qa status / run / report / submit）
[project.scripts]
qa = "qa.cli:main"

[tool.setuptools.packages.find]
include = ["qa*"]

[tool.pytest.ini_options]
testpaths = ["qa/tests"]
python_files = ["test_*.py"]
addopts = "-v"
